[package]
name = "wslpluginapi-sys"
version.workspace = true
edition.workspace = true
readme.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["wsl", "plugin", "windows", "linux", "ffi"]
categories = ["os::windows-apis", "external-ffi-bindings", "virtualization"]

[features]
hooks-field-names = ["dep:struct-field-names-as-array"]
"Windows_Win32_Security_Authorization" = [
  "windows-sys/Win32_Security_Authorization",
]

[build-dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
semver = "1.0"
sha2 = "0.10.9"
anyhow = "1.0"
hex = "0.4"

[target.'cfg(unix)'.build-dependencies]
cow-utils = { version = "0.1" }

[dependencies]
libc = "0.2"
struct-field-names-as-array = { version = "0.3", features = [
  "derive",
], optional = true }

[dependencies.windows-sys]
version = ">0.32"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_Networking_WinSock",
]

[package.metadata.docs.rs]
all-features = true
targets = [
  "x86_64-pc-windows-gnu",
  "x86_64-pc-windows-gnullvm",
  "aarch64-pc-windows-gnullvm",
]
