[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MIT-0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
]

confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
