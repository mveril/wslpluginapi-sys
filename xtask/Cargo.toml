[package]
license.workspace = true
version.workspace = true
name = "xtask"
edition = "2024"
publish = false

[dependencies]
quick-xml = { version = "0.38", features = ["serialize"] }
clap = { version = "4.0", features = ["derive"] }
cargo_metadata = "0.23"
ureq = "3.0"
zip = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
clap-verbosity-flag = "3.0"
anyhow = "1.0"
regex = { version = "1.11", features = ["use_std"] }
walkdir = "2.5"
bindgen = "0.72"
cfg-if = "1.0"
constcat = "0.6"
sha2 = "0.10.9"
hex = "0.4"

[build-dependencies]
cargo-lock = "11.0"

[target.'cfg(unix)'.dependencies]
cow-utils = { version = "0.1" }
